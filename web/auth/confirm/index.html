<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이메일 확인 | 오늘마주</title><meta name="description" content="오늘마주 이메일 확인"><meta name="theme-color" content="#ffa2be"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2718%27%20fill%3D%27%23fff0f6%27%2F%3E%3Cpath%20d%3D%27M32%2048C18%2039%2011%2031%2016%2022c4-7%2012-6%2016%201%204-7%2012-8%2016-1%205%209-2%2017-16%2026Z%27%20fill%3D%27%23ffa2be%27%2F%3E%3Ccircle%20cx%3D%2744%27%20cy%3D%2722%27%20r%3D%277%27%20fill%3D%27%23bce3ad%27%2F%3E%3Ccircle%20cx%3D%2725%27%20cy%3D%2743%27%20r%3D%275%27%20fill%3D%27%23d3c0ea%27%2F%3E%3C%2Fsvg%3E"><link rel="stylesheet" href="/style.css"></head><body class="flow-page"><a class="skip" href="#main">본문으로 이동</a><header class="flow-header"><a href="/" class="wordmark" aria-label="오늘마주 홈"><span class="logo-title"><i class="brand-pink">오늘</i><i class="brand-green">마</i><i class="brand-purple">주</i></span><span>ONEULMAJU</span></a><a href="/" class="flow-home">홈으로</a></header><main class="flow-main" id="main"><div class="preview-notice" id="service-status" role="status">회원 서비스 연결 상태를 확인하고 있어요.</div><div class="flow-heading profile-heading"><h1 id="confirmation-title">이메일 확인 중이에요.</h1><p id="confirmation-status" role="status">이메일 인증 정보를 확인하고 있어요.</p></div><div id="confirmation-actions"><a href="/login/" class="button primary full">회원 로그인으로 계속</a><div class="alternative-link"><a href="/auth/resend/">인증 메일 다시 받기</a><a href="/forgot-password/">비밀번호 재설정</a></div></div><form id="password-reset-form" hidden><p class="form-footnote">비밀번호를 변경할 이메일<br><strong id="recovery-email"></strong></p><div class="field"><label for="new-password">새 비밀번호</label><input id="new-password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required placeholder="10자 이상 입력해주세요"></div><div class="field"><label for="new-password-confirm">새 비밀번호 확인</label><input id="new-password-confirm" name="confirm" type="password" autocomplete="new-password" minlength="10" maxlength="128" required placeholder="한 번 더 입력해주세요"></div><p id="password-reset-error" class="form-error" role="alert"></p><label class="consent-line"><input name="recoveryConsent" type="checkbox" required><span>위 이메일이 내 계정이며, 비밀번호를 변경하는 데 동의해요.</span></label><button id="save-password" type="submit" class="button primary full" disabled>새 비밀번호 저장하고 계속</button><p class="form-footnote"><a href="/forgot-password/">재설정 메일 다시 받기</a></p></form></main><footer class="flow-footer">오늘, 새로운 사람과 마주하는 시간.</footer><script src="/auth-flow.js" defer></script></body></html>
