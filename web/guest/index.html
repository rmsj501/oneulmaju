<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>비회원 로그인 | 오늘마주</title><meta name="description" content="오늘마주 비회원 로그인과 프로필 작성 화면 체험."><meta name="theme-color" content="#ffa2be"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2718%27%20fill%3D%27%23fff0f6%27%2F%3E%3Cpath%20d%3D%27M32%2048C18%2039%2011%2031%2016%2022c4-7%2012-6%2016%201%204-7%2012-8%2016-1%205%209-2%2017-16%2026Z%27%20fill%3D%27%23ffa2be%27%2F%3E%3Ccircle%20cx%3D%2744%27%20cy%3D%2722%27%20r%3D%277%27%20fill%3D%27%23bce3ad%27%2F%3E%3Ccircle%20cx%3D%2725%27%20cy%3D%2743%27%20r%3D%275%27%20fill%3D%27%23d3c0ea%27%2F%3E%3C%2Fsvg%3E"><link rel="stylesheet" href="/style.css"></head><body class="flow-page"><a class="skip" href="#main">본문으로 이동</a><header class="flow-header"><a href="/" class="wordmark" aria-label="오늘마주 홈"><span class="logo-title"><i class="brand-pink">오늘</i><i class="brand-green">마</i><i class="brand-purple">주</i></span><span>ONEULMAJU</span></a><a href="/" class="flow-home">홈으로</a></header><main class="flow-main" id="main"><div class="preview-notice" id="service-status" role="status">회원 서비스 연결 상태를 확인하고 있어요.</div><aside class="preview-entry"><a class="button secondary full" href="/profile/?preview=1">가입 없이 프로필 작성 화면 미리보기</a><p>계정 생성 없이 화면을 확인해요. 사진·서류는 전송되지 않아요.</p></aside><nav class="access-tabs" aria-label="프로필 작성 방식"><a href="/join/">회원가입</a><a href="/guest/" aria-current="page">비회원 로그인</a></nav><div class="flow-heading"><span class="flow-kicker green-text">A SIMPLE FIRST STEP</span><h1>비회원 로그인</h1><p>회원가입 없이,<br>이번 만남을 위한 프로필을 작성해보세요.</p></div><form id="access-form" data-mode="guest" class="access-form"><div class="field"><label for="access-name">이름</label><input id="access-name" name="name" autocomplete="name" placeholder="이름을 입력해주세요" maxlength="30" required></div><div class="field"><label for="access-phone">휴대폰 번호</label><input id="access-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="010-0000-0000" pattern="[0-9\- ]{10,14}" maxlength="14" required></div><div class="guest-info"><span>휴대폰 번호 확인</span><p>문자로 받은 인증번호 6자리를 입력하면<br>저장된 프로필을 다시 불러올 수 있어요.</p></div><div class="otp-field" id="otp-wrap" hidden><div class="field"><label for="otp-code">인증번호 6자리</label><input id="otp-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="문자로 받은 인증번호" disabled></div><button class="button green-button full" id="verify-otp" type="button">인증하고 프로필 작성</button></div><p id="access-error" class="form-error" role="alert"></p><label class="consent-line"><input name="accountConsent" type="checkbox" required><span>휴대폰 인증과 프로필 재조회를 위한 계정 정보 수집·이용에 동의해요. <a href="/privacy/">안내 보기</a></span></label><button class="button green-button full" type="submit">인증번호 받기</button></form><div class="alternative-link">회원으로 시작하고 싶다면 <a href="/join/">회원가입 화면 보기</a></div></main><footer class="flow-footer">오늘, 새로운 사람과 마주하는 시간.</footer><script src="/auth-flow.js" defer></script></body></html>
