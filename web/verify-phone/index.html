field"><label for="otp-code">인증번호 6자리</label><input id="otp-code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="문자로 받은 인증번호" disabled></div><button id="verify-otp" class="button green-button full" type="button">인증 완료하기</button></div><p id="access-error" class="form-error" role="alert"></p><button class="button secondary full" type="submit">인증번호 받기</button></form><div class="profile-account-actions"><a href="/login/">회원 로그인</a><button type="button" id="logout">로그아웃</button></div></main><footer class="flow-footer">오늘, 새로운 사람과 마주하는 시간.</footer><script src="/auth-flow.js" defer></script></body></html>
